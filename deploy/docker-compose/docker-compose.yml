# FHIR ePI Enterprise System - local development stack (open-source)
# Purpose: bring up all OSS backing services on a single host for development.
# Same container images deploy to Kubernetes unchanged (see README).
#
# Usage:
#   cp .env.example .env
#   docker compose up -d              # core services
#   docker compose --profile observability up -d
#   docker compose --profile gateway up -d
#   docker compose down               # stop (add -v to wipe volumes)
#
# NOTE: this is a development scaffold - dev-mode security (open ports, default
# creds, TLS off). Do NOT use these settings in test/prod; production runs on
# Kubernetes with hardened config, secrets, and network policy.

name: epi-dev

networks:
  epi:
    driver: bridge

volumes:
  pg_data:
  es_data:
  opensearch_data:
  minio_data:
  kafka_data:
  grafana_data:

services:

  # ---- Relational database (shared; separate DBs per component) ----
  postgres:
    # pin-ok: PostgreSQL's version is major.minor - 16.15 is a complete version, not a
    # major line that moves. There is no third component to pin to.
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: hapi,keycloak,epi_operational
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres-multi-db.sh:/docker-entrypoint-initdb.d/10-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [epi]

  # ---- FHIR content core (canonical store, FHIR REST API) ----
  hapi-fhir:
    # Pinned by digest: this project publishes version tags less often than it pushes
    # latest, and there is no v8.10.0 tag for the 8.10.0 image the stack was verified on.
    image: hapiproject/hapi@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      HAPI_FHIR_FHIR_VERSION: R5
    ports:
      - "${HAPI_PORT:-8090}:8080"   # FHIR API at http://localhost:8090/fhir
    networks: [epi]

  # ---- Terminology: Snowstorm requires Elasticsearch 8.x ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx4g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [epi]

  snowstorm:
    # Pinned by digest. This image is published only as :latest, and its layout changed
    # underneath us: it is now built with Jib and ships exploded classes rather than an
    # app.jar, so the entrypoint that used to work stopped working with no version to
    # blame. A digest is the only pin the publisher offers (ADR-014).
    image: snomedinternational/snowstorm@sha256:2516354dd157bfce5f420d9d4317426061b2df58516b0dfe5769e43eca50b581
    depends_on:
      elasticsearch:
        condition: service_healthy
    # The image's own entrypoint is left alone - it carries the classpath and main class
    # that Jib generated. Heap size goes through the JVM's own environment variable, and
    # the Elasticsearch URL is an argument to the application rather than to java.
    environment:
      # --add-opens for java.util is the image's omission, not ours: its own entrypoint
      # opens java.lang only, and Spring Data's mapping context reflects over
      # java.util.TimeZone, so the application cannot start without it on a modern JDK.
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx4g --add-opens=java.base/java.util=ALL-UNNAMED"
    command: ["--elasticsearch.urls=http://elasticsearch:9200"]
    ports:
      - "${SNOWSTORM_PORT:-8091}:8080"   # Snowstorm FHIR terminology at http://localhost:8091/fhir
    networks: [epi]

  # ---- Content search index (cap 15) ----
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
    networks: [epi]

  # ---- Object store with WORM (object-lock) for assets, audit exports, archive ----
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [epi]

  # One-shot: create buckets WITH object-lock (WORM) enabled, and set the retention that makes
  # the lock do anything. A bucket created --with-lock and left without a default retention is
  # the defect ADR-034 found here: it reads as protected and protects nothing, because retention
  # is what an object-lock bucket applies to the versions written into it.
  #
  # Object-lock is only half of write-once, and the half it is not is not configurable here:
  # retention stops a written version being destroyed, and a conditional write (If-None-Match)
  # is what stops a second write of the same key becoming what a read returns. The store issues
  # that itself - see ADR-034 and src/Epi.Rendering/ObjectStoreAssetStore.cs.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --with-lock --ignore-existing local/epi-content;
      mc mb --with-lock --ignore-existing local/epi-artwork;
      mc mb --with-lock --ignore-existing local/epi-rendered;
      mc mb --with-lock --ignore-existing local/epi-audit;
      mc mb --with-lock --ignore-existing local/epi-archive;
      mc retention set --default COMPLIANCE 3650d local/epi-audit;
      mc retention set --default COMPLIANCE 3650d local/epi-archive;
      mc retention set --default COMPLIANCE 3650d local/epi-rendered;
      mc retention set --default COMPLIANCE 3650d local/epi-artwork;
      mc retention set --default COMPLIANCE 3650d local/epi-content;
      echo 'MinIO buckets created with object-lock (WORM) and default retention.';
      "
    networks: [epi]

  # ---- Event backbone (KRaft mode, single node) ----
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [epi]

  # ---- Identity provider (OIDC/SAML) ----
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    # The demonstration realm is imported at start-up rather than clicked together, so the
    # identity provider is reproducible and reviewable like every other piece of configuration
    # here. Import is skipped silently if the realm already exists, so this is safe to leave on.
    command: start-dev --import-realm
    volumes:
      - ./init/keycloak-epi-realm.json:/opt/keycloak/data/import/epi-realm.json:ro
    environment:
      # The issuer a token carries has to be one both sides agree on. Callers reach Keycloak
      # from the host, so tokens are issued as http://localhost:8081/realms/epi; the API
      # reaches it over the compose network and would otherwise expect an issuer of
      # http://keycloak:8080/realms/epi and reject every token as coming from a stranger.
      # Fixing the hostname settles the issuer, and the dynamic backchannel lets the API keep
      # fetching discovery and keys over the internal network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"   # admin console at http://localhost:8081
    networks: [epi]

  # ---- Policy decision point (RBAC/ABAC) ----
  opa:
    # Pinned, and not the -rootless variant: that tag has been deprecated since OPA v0.50.0
    # and is frozen on 0.x, while CI runs 1.x and the policies here are written for 1.x. The
    # dev stack therefore refused to load its own policy on syntax CI accepts. The default
    # image has run as a non-root user since the rootless variant was retired.
    image: openpolicyagent/opa:1.19.0
    # The repository's policies and their data, loaded rather than left to be added by hand.
    # An OPA with no policy answers undefined, the platform reads undefined as deny, and every
    # request is refused with nothing to say why - which is correct behaviour and an
    # unhelpful demonstration.
    # Tests are excluded deliberately. They belong to CI, not to a running decision point,
    # and loading them here made the server refuse to start on test syntax its version parses
    # differently from the one CI runs.
    command:
      ["run", "--server", "--addr", ":8181", "--log-level", "info",
       "--ignore=*_test.rego", "--set=decision_logs.console=true",
       "/policies/authz", "/policies/data"]
    volumes:
      - ../../policies:/policies:ro
    ports:
      - "${OPA_PORT:-8181}:8181"
    networks: [epi]

  # ---- Rendering: HTML -> PDF (rendered lineage; distinct from artwork) ----
  gotenberg:
    # Pinned to the version this stack has been verified on. PR 38 pinned every image and
    # missed this one: ":8" is a major-version tag that moves, which is the thing that pull
    # request existed to stop (ADR-014).
    image: gotenberg/gotenberg:8.35.0
    command: ["gotenberg", "--api-port=3000"]
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    networks: [epi]

  # ---- The platform itself: the walking skeleton of design/iteration-1.md ----
  epi-api:
    build:
      context: ../..
      dockerfile: src/Epi.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      # Not for start-up - nothing is filed then - but so that the first official render does
      # not fail against a bucket minio-init has yet to create.
      minio-init:
        condition: service_completed_successfully
    environment:
      # Each dependency is real here. Left unset, the service falls back to in-memory
      # components and says so loudly at start-up.
      Epi__Content__FhirServerUrl: http://hapi-fhir:8080/fhir
      Epi__Audit__ConnectionString: "Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=epi_operational"
      Epi__Events__BootstrapServers: kafka:9092
      Epi__Authorization__OpaUrl: http://opa:8181
      # Authentication is delegated to Keycloak. The realm, its clients and its people are
      # imported at start-up from init/keycloak-epi-realm.json - nothing to create by hand.
      # Without an authority configured, every content call is refused.
      Epi__Authentication__Authority: http://keycloak:8080/realms/epi
      Epi__Authentication__Audience: epi-api
      # Signing re-checks the signer's password at the gate (ADR-020 decision 1). Left unset,
      # the platform refuses every signature rather than accepting any, and says so at start-up.
      Epi__Signing__KeycloakUrl: http://keycloak:8080
      Epi__Signing__Realm: epi
      Epi__Signing__ClientId: epi-signing
      Epi__Governance__ConnectionString: "Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=epi_operational"
      # Where produced artefacts are filed (ADR-034, ADR-046). The bucket is created with
      # object-lock by minio-init; retention comes from mounted configuration, because an
      # artefact written without a retention period is indistinguishable from one written with
      # it until somebody tries to destroy it.
      Epi__Assets__Endpoint: http://minio:9000
      Epi__Assets__AccessKey: ${MINIO_ROOT_USER}
      Epi__Assets__SecretKey: ${MINIO_ROOT_PASSWORD}
      Epi__Assets__Bucket: epi-rendered
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      # Configuration and the pinned conformance packages are mounted, so changing a market or
      # the identifier authority does not mean rebuilding the image.
      - ../../config:/config:ro
      - ../../profiles/packages:/app/profiles/packages:ro
    ports:
      - "${EPI_API_PORT:-8080}:8080"
    networks: [epi]

  # ============ optional profile: observability ============
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./init/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    networks: [epi]

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    volumes:
      - ./init/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [epi]

  grafana:
    image: grafana/grafana:13.1.3
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks: [epi]

  # ============ optional profile: gateway ============
  kong:
    image: kong:3.9.3
    profiles: ["gateway"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./init/kong.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"   # proxy
      - "${KONG_ADMIN_PORT:-8001}:8001"   # admin API
    networks: [epi]

  # ============ optional profile: messaging ============
  rabbitmq:
    image: rabbitmq:3.13.7-management
    profiles: ["messaging"]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_CONSOLE_PORT:-15672}:15672"
    networks: [epi]
