name: Dependency review

# Public repository: block pull requests that introduce vulnerable or
# licence-incompatible dependencies (D3 Section 8.2, supply-chain controls).

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Apache-2.0 project (see LICENSE/NOTICE): reject copyleft-incompatible additions.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
