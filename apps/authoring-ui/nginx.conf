# Serving the authoring surface: static files, and single-page-application routing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # An address this surface owns - /?label=... and anything added later - is not a file on disk.
  # Anything that is not a file falls back to index.html so the application can read it. Without
  # this, opening a label by its URL answers 404, and linking to a label is how the surface is
  # meant to be used.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cached. It says where the platform and the identity provider are, and a browser holding
  # yesterday's copy is a surface pointed somewhere it is not meant to be - which is exactly the
  # silent misconfiguration ADR-049 exists to avoid.
  location = /config.json {
    add_header Cache-Control "no-store" always;
  }
}
